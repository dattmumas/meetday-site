<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d9d8d2">
<title>Block moved to block.lnkd.world</title>
<script>
  // The same path, query and fragment on the new address. The origin is fixed text, so no
  // path can send a visitor to another host: "//other.host" stays a path on block.lnkd.world.
  (function () {
    var to = "https://block.lnkd.world" + location.pathname + location.search + location.hash;
    location.replace(to);
    document.addEventListener("DOMContentLoaded", function () {
      var a = document.getElementById("to");
      a.href = to;
      a.textContent = to.replace("https://", "");
    });
  })();
</script>
<style>
  html, body { margin: 0; background: #d9d8d2; color: #1d1f22; }
  body { font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 72px 20px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 16px; }
  a { color: #1d55c0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Block moved to block.lnkd.world</h1>
  <p>Go to <a id="to" href="https://block.lnkd.world/">block.lnkd.world</a>.</p>
</main>
</body>
</html>
